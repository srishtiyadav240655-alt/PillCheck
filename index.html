<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0E9F6E">
<title>PillCheck</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Devanagari:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#FFFFFF;--soft:#F5FAF8;--mint:#EAF7F1;--card:#fff;--ink:#1B2A41;--mute:#64748B;--brand:#0E9F6E;--brandd:#0B7F58;--navy:#16315E;--gr:#0E9F6E;--line:#E3EAF0;--sel:#EAF7F1;--g:#0B7F58;--gb:#ECFAF3;--y:#8A5A00;--yb:#FFF7E3;--r:#B42318;--rb:#FEF0EE;color-scheme:light;box-sizing:border-box}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Plus Jakarta Sans","Noto Sans Devanagari",system-ui,sans-serif;font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
#app{max-width:480px;margin:0 auto;padding:calc(14px + env(safe-area-inset-top,0px)) 16px 140px}#app.wide{max-width:1080px;padding:0 20px 30px}
h1{font-size:24px;margin:6px 0;font-weight:700;letter-spacing:-.01em;line-height:1.25}h2{font-size:18px;margin:18px 0 8px;font-weight:700}.sub{color:var(--mute);margin:0 0 10px;font-size:15px}
button{font:inherit;cursor:pointer;border:0;border-radius:14px;padding:12px 18px;font-weight:600;min-height:52px;color:inherit}
button:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid #7bd3b3;outline-offset:2px}
.big{width:100%;background:var(--brand);color:#fff;font-size:16px;box-shadow:0 6px 16px rgba(14,159,110,.22)}.big.alt{background:#fff;color:var(--navy);border:1.5px solid var(--line);box-shadow:none}.big[disabled]{opacity:.4;box-shadow:none}.big.g{background:var(--brand)}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;margin:10px 0;box-shadow:0 2px 10px rgba(22,49,94,.04)}
.row{display:flex;gap:12px;align-items:center}.grow{flex:1;min-width:0}
nav{position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,.96);border-top:1px solid var(--line);display:none;justify-content:center;padding:8px 8px calc(8px + env(safe-area-inset-bottom,0px))}
nav div{display:flex;width:100%;max-width:480px;gap:6px}nav button{flex:1;background:none;color:var(--mute);font-size:12px;font-weight:600;padding:6px;min-height:56px;border-radius:14px}nav button b{display:block;font-size:22px}nav button.on{background:var(--mint);color:var(--brandd)}
.hd{display:flex;align-items:center;gap:10px;margin:0 0 10px}.logo{width:40px;height:40px;background:#fff;border-radius:12px;padding:2px;border:1px solid var(--line);flex:none}.logo img{width:100%;height:100%;object-fit:contain;border-radius:10px}
.wm{font-size:22px;font-weight:700;line-height:1;letter-spacing:-.02em}.wm span{color:var(--navy)}.wm b{color:var(--brand)}
.lg{background:#fff;border:1.5px solid var(--line);min-height:40px;padding:6px 12px;border-radius:12px;font-size:14px;color:var(--navy)}
.ob{display:flex;flex-direction:column;align-items:center;text-align:center}.mas{display:block;object-fit:contain;margin:0 auto}.mas.angry{filter:hue-rotate(150deg) saturate(1.4)}
.cta{position:fixed;left:0;right:0;bottom:0;padding:14px 16px calc(14px + env(safe-area-inset-bottom,0px));background:linear-gradient(rgba(255,255,255,0),#fff 40%)}.cta .big{max-width:480px;margin:auto;display:block}
.pg{width:100%;height:6px;background:var(--line);border-radius:6px;margin:6px 0 4px}.pg i{display:block;height:100%;background:var(--brand);border-radius:6px;transition:width .4s}.pgl{font-weight:600;font-size:13px;color:var(--mute);margin-bottom:6px}
.frame{position:relative;width:100%;margin:12px 0;border-radius:24px;padding:38px 18px 56px;text-align:center;background:var(--soft);border:1px solid var(--line)}.frame i{position:absolute;width:30px;height:30px;border:5px solid var(--brand)}.frame .a{top:12px;left:12px;border-right:0;border-bottom:0;border-radius:12px 0 0 0}.frame .b{top:12px;right:12px;border-left:0;border-bottom:0;border-radius:0 12px 0 0;border-color:var(--navy)}.frame .c{bottom:12px;left:12px;border-right:0;border-top:0;border-radius:0 0 0 12px;border-color:var(--navy)}.frame .d{bottom:12px;right:12px;border-left:0;border-top:0;border-radius:0 0 12px 0}
.light{border-radius:18px;padding:14px;margin:10px 0;border:1px solid;text-align:left;width:100%}.light.green{background:var(--gb);border-color:#bfe8d2}.light.yellow{background:var(--yb);border-color:#f0dca4}.light.red{background:var(--rb);border-color:#f6c6c1}
.light h3{margin:0 0 4px;font-size:17px;font-weight:700}.light.green h3{color:var(--g)}.light.yellow h3{color:var(--y)}.light.red h3{color:var(--r)}
.pill{width:44px;height:44px;border-radius:50%;flex:none;border:2px solid rgba(0,0,0,.12);box-shadow:inset 0 -7px 0 rgba(0,0,0,.07)}
.tag{display:inline-block;background:var(--soft);border:1px solid var(--line);border-radius:999px;padding:0 10px;font-size:13px;margin:4px 6px 0 0;color:var(--mute)}
.mic{display:inline-flex;gap:6px;align-items:center;background:#fff;color:var(--brandd);border:1.5px solid #bfe8d2;padding:6px 14px;min-height:42px;margin-top:8px;border-radius:999px;font-size:14px}
.opt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:#fff;border:1.5px solid var(--line);border-radius:16px;padding:12px 14px;margin:8px 0;color:var(--ink)}.opt.on{background:var(--sel);border-color:var(--brand)}.opt .ck{margin-left:auto;font-size:22px}
.slot{border-radius:20px;padding:4px 12px 12px;margin:14px 0}.slot h2{margin:10px 0 6px;font-size:16px}.slot .card{color:var(--ink);box-shadow:none}
.s0{background:#FFF9E6;color:#6b5200}.s1{background:#FFF1EA;color:#8a3d12}.s2{background:#F1F3F8;color:#2d3a55}.s3{background:#E9EFFA;color:var(--navy)}
.opt.s0,.opt.s1,.opt.s2,.opt.s3{border-color:transparent}.opt.off{opacity:.5}
.name{font-weight:600;font-size:17px}.done{opacity:.5}.done .name{text-decoration:line-through}
.chk{width:48px;height:48px;border-radius:50%;background:#fff;border:2px solid var(--line);font-size:22px;padding:0;min-height:48px;flex:none;color:var(--mute)}.done .chk{background:var(--brand);border-color:var(--brand);color:#fff}
.bar{height:8px;background:var(--line);border-radius:10px;overflow:hidden}.bar i{display:block;height:100%;background:var(--brand);transition:width .4s}
.x{background:var(--rb);color:var(--r);min-height:40px;padding:6px 12px;border-radius:12px}
input[type=text],input[type=time]{font:inherit;width:100%;padding:11px 12px;border-radius:12px;border:1.5px solid var(--line);background:#fff;color:var(--ink)}input[type=time]{width:auto}
.disc{font-size:12px;color:var(--mute);text-align:center;margin:18px 0}
#al{position:fixed;inset:0;z-index:50;display:none;overflow:auto;text-align:center;padding:calc(20px + env(safe-area-inset-top,0px)) 18px 24px}
#al.full{background:#F2FBF7;color:var(--ink)}#al.full.red{background:#FEF1F0}
#al.sm{inset:auto 10px auto 10px;top:calc(10px + env(safe-area-inset-top,0px));border-radius:18px;background:#fff;border:1.5px solid var(--brand);padding:12px;text-align:left;box-shadow:0 10px 30px rgba(22,49,94,.18)}
#al h1{font-size:34px;margin:2px 0;line-height:1.1;color:var(--navy)}#al .ar{background:#fff;border:1px solid var(--line);border-radius:16px;padding:10px;margin:8px 0;display:flex;gap:12px;align-items:center;text-align:left}
#al button+button{margin-top:10px}
.shk{animation:sh .5s ease-in-out infinite}@keyframes sh{25%{transform:rotate(-3deg)}75%{transform:rotate(3deg)}}
.tb{position:sticky;top:0;background:rgba(255,255,255,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);z-index:5;margin:0 -20px;padding:0 20px}.tbi{display:flex;align-items:center;justify-content:space-between;gap:10px;max-width:1080px;margin:auto;padding:10px 0}
.nl{display:none;gap:26px}.nl a{color:var(--ink);text-decoration:none;font-weight:500;font-size:15px}.sb{background:var(--brand);color:#fff;min-height:42px;padding:6px 18px;border-radius:999px;font-size:14px}
.hero{display:grid;gap:30px;padding:32px 0 6px}.chip{display:inline-block;background:var(--mint);color:var(--brandd);border:1px solid #cfeede;border-radius:999px;padding:3px 12px;font-size:13px;font-weight:600}
.hero h1{font-size:48px;line-height:1.05;letter-spacing:-.03em;margin:14px 0 4px}.tg2{font-size:22px;font-weight:700;color:var(--navy);margin-bottom:8px}.hero p{color:var(--mute);max-width:520px}
.bt{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0}.bt button{width:auto;min-width:150px}.tr{display:flex;gap:16px;flex-wrap:wrap;color:var(--mute);font-size:13px}
.phw{display:flex;gap:16px;align-items:center;flex-wrap:wrap;justify-content:center}.ph{width:220px;border:7px solid var(--navy);border-radius:34px;background:#fff;padding:14px 10px;text-align:center;box-shadow:0 20px 46px rgba(22,49,94,.15)}
.fcs{display:grid;gap:10px;flex:1 1 210px;max-width:270px}.fc{display:flex;gap:10px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px 12px;box-shadow:0 6px 18px rgba(22,49,94,.06);text-align:left}.fc b{font-size:14px;display:block}.fc small{color:var(--mute);font-size:12px;line-height:1.3;display:block}
.sec{margin-top:56px;text-align:center}.sec h2{font-size:28px;margin:0 0 4px;letter-spacing:-.02em;color:var(--navy)}
.grid5{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));margin-top:20px}.ft{padding:10px}.fi{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;font-size:22px;margin:0 auto 8px}.ft b{font-size:15px}.ft p{color:var(--mute);font-size:13px;margin:4px 0}
.steps{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));background:var(--soft);border:1px solid var(--line);border-radius:22px;padding:20px;margin-top:20px}.st{background:#fff;border-radius:16px;padding:16px;border:1px solid var(--line)}.st .n{width:30px;height:30px;border-radius:50%;background:var(--brand);color:#fff;display:grid;place-items:center;font-weight:700;margin:0 auto 6px;font-size:14px}.st p{color:var(--mute);font-size:14px;margin:4px 0 0}
.fo{margin-top:50px;padding:20px 0;border-top:1px solid var(--line);color:var(--mute);font-size:13px;text-align:center}
@media(min-width:820px){.nl{display:flex}.hero{grid-template-columns:1.05fr .95fr;align-items:center;padding:60px 0 20px}.hero h1{font-size:68px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>

["ibuprofen","amlodipine","yellow",["Painkiller can weaken the BP medicine.","दर्द की दवा से BP की दवा का असर कम हो सकता है।"],["Check BP daily; avoid long use.","रोज़ BP नापें; लंबे समय तक न लें।"]],
["ibuprofen","telmisartan","yellow",["Can weaken BP medicine and strain the kidneys.","BP की दवा कमज़ोर और गुर्दों पर ज़ोर पड़ सकता है।"],["Drink water; watch BP.","पानी पिएँ; BP देखते रहें।"]],
["warfarin","paracetamol","yellow",["Regular high doses can increase blood-thinning.","रोज़ ज़्यादा मात्रा से खून पतला होने का असर बढ़ सकता है।"],["Tell your doctor you take both.","डॉक्टर को बताएँ कि दोनों लेते हैं।"]],
["clopidogrel","aspirin","yellow",["Often prescribed together, but bleeding risk rises slightly.","अक्सर साथ दी जाती हैं, पर खून बहने का खतरा थोड़ा बढ़ता है।"],["Take only the dose your doctor gave.","सिर्फ़ डॉक्टर की बताई मात्रा लें।"]]];
const SAMPLE=["Ecosprin 75","Uniwarfin 5mg","Dolo 650"];

const mascot=(m,z)=>`<img class="mas ${m}" src="${MASC}" alt="" width="${Math.round(z*.73)}" height="${z}">`;
const HEAD=()=>`<div class="hd"><div class="logo" onclick="home()" style="cursor:pointer"><img src="${LOGO}" alt="PillCheck"></div><div class="grow" onclick="home()" style="cursor:pointer"><div class="wm"><span>Pill</span><b>Check</b></div></div><button class="lg" onclick="setLang()">${S.lang=="hi"?"EN":"हिं"}</button></div>`;
const pill=g=>`<div class="pill" style="background:${(DB[g]||{c:"#ddd"}).c}"></div>`;

function resolve(t){const x=t.toLowerCase().replace(/[0-9]+\s*(mg|mcg)?/g,"").trim();if(DB[x])return x;for(const b in BR)if(x.includes(b))return BR[b];for(const g in DB)if(x.includes(g))return g;return null}
function addMed(t){t=t.trim();if(!t)return;const g=resolve(t);S.meds.push({t,g,slot:g?DB[g].s:0})}
function computeWarn(){const k=[...new Set(S.meds.map(m=>m.g).filter(Boolean))];S.warn=PAIRS.filter(p=>k.includes(p[0])&&k.includes(p[1]))}
function assign(){const en=[0,1,2,3].filter(i=>S.on[i]);if(!en.length){S.on[0]=1;en.push(0)}
 const pick=s=>en.includes(s)?s:(en.find(x=>x>=s)??en[en.length-1]);
 S.meds.forEach(m=>{if(m.g)m.slot=pick(DB[m.g].s)});
 S.warn.forEach(p=>{const a=S.meds.find(m=>m.g==p[0]),b=S.meds.find(m=>m.g==p[1]);if(a&&b&&a.slot==b.slot&&en.length>1){b.slot=en[(en.indexOf(b.slot)+1)%en.length]}})}
function analyse(reset){computeWarn();assign();if(reset)S.taken={};save()}
const level=()=>S.warn.some(w=>w[2]=="red")?"red":S.warn.length?"yellow":"green";
function say(t){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang=L()?"hi-IN":"en-IN";u.rate=.85;speechSynthesis.speak(u)}catch(e){}}
async function shrink(f){return new Promise(r=>{const i=new Image(),u=URL.createObjectURL(f);i.onload=()=>{const k=Math.min(1,1280/Math.max(i.width,i.height)),c=document.createElement("canvas");c.width=Math.round(i.width*k);c.height=Math.round(i.height*k);c.getContext("2d").drawImage(i,0,0,c.width,c.height);URL.revokeObjectURL(u);r(c.toDataURL("image/jpeg",.85).split(",")[1])};i.onerror=()=>r(null);i.src=u})}
async function geminiScan(files,key){key=key.trim();
 const parts=[{text:'These are photos of medicine bottles, strips or a prescription. Return ONLY a JSON array of strings: each medicine brand or generic name with strength, e.g. ["Dolo 650"]. No other text.'}];
 for(const f of files){const b=await shrink(f);if(b)parts.push({inline_data:{mime_type:"image/jpeg",data:b}})}
 if(parts.length<2)throw new Error("Photo could not be read");
 let err="";
 for(const m of ["gemini-2.5-flash","gemini-2.0-flash","gemini-flash-latest"]){
  try{const r=await fetch("https://generativelanguage.googleapis.com/v1beta/models/"+m+":generateContent",{method:"POST",headers:{"Content-Type":"application/json","x-goog-api-key":key},body:JSON.stringify({contents:[{parts}]})});
   const d=await r.json();if(d.error){err=m+": "+(d.error.message||r.status);continue}
   const t=d.candidates[0].content.parts.map(p=>p.text||"").join("");return JSON.parse(t.match(/\[[\s\S]*\]/)[0])}catch(e){err=m+": "+e.message}}
 throw new Error(err)}
async function scan(files){S.scanning=true;S.msg=T("Reading your medicines...","दवाइयाँ पढ़ रहा हूँ...");render();let names=null,key="";try{key=localStorage.getItem("gk")||""}catch(e){}
 let note="";if(key&&files.length){try{names=await geminiScan(files,key)}catch(e){note=T("Live scan failed: ","लाइव स्कैन नहीं चला: ")+String(e.message).slice(0,200)+" — "+T("showing demo list.","डेमो सूची दिखा रही हूँ।")}}
 const live=!!names;S.fail=!live&&!!note;if(!names){await new Promise(r=>setTimeout(r,1000));names=SAMPLE;S.msg=note||T("Demo scan: 3 medicines found. Please check.","डेमो स्कैन: 3 दवाइयाँ मिलीं। जाँच लें।")}else S.msg=names.length+T(" medicines found. Please check."," दवाइयाँ मिलीं। जाँच लें।");
 if(!live)S.meds=[];const have=new Set(S.meds.map(m=>m.t.toLowerCase()));names.forEach(n=>{if(typeof n=="string"&&n.trim()&&!have.has(n.trim().toLowerCase())){have.add(n.trim().toLowerCase());addMed(n)}});S.scanning=false;analyse(true);render();say(T("I found "+S.meds.length+" medicines. Please check them.","मुझे "+S.meds.length+" दवाइयाँ मिलीं। कृपया जाँच लें।"))}

function light(){if(!S.meds.length)return"";const l=level();
 if(l=="green")return`<div class="light green"><h3>🟢 ${T("All clear","सब ठीक है")}</h3>${T("No risky combination found.","कोई ख़तरनाक मेल नहीं मिला।")}<br><button class="mic" onclick="say(T('All clear. No risky combination found.','सब ठीक है। कोई ख़तरनाक मेल नहीं मिला।'))">🔊 ${T("Listen","सुनिए")}</button></div>`;
 return`<div class="light ${l}"><h3>${l=="red"?"🔴 "+T("STOP! Do not take together","रुकिए! साथ न लें"):"🟡 "+T("Be careful","ध्यान दें")}</h3>`+S.warn.map((w,i)=>`<div style="margin-top:10px;padding-top:8px;border-top:2px solid var(--line)"><div class="row">${pill(w[0])}<b style="font-size:26px;color:var(--${w[2]=="red"?"r":"y"})">✖</b>${pill(w[1])}</div><div class="name">${DB[w[0]].n[L()]} + ${DB[w[1]].n[L()]}</div>${w[3][L()]}<div><b>${T("What to do:","क्या करें:")}</b> ${w[4][L()]}</div><button class="mic" onclick="sayW(${i})">🔊 ${T("Listen","सुनिए")}</button></div>`).join("")+`</div>`}
function sayW(i){const w=S.warn[i];say(T("Be careful. ","ध्यान दें। ")+DB[w[0]].n[L()]+T(" and "," और ")+DB[w[1]].n[L()]+T(" should not be taken together. "," साथ न लें। ")+w[3][L()]+" "+w[4][L()])}

function prog(n){return`<div class="row" style="width:100%;justify-content:space-between;margin-bottom:6px"><button class="lg" onclick="home()">←</button><button class="lg" onclick="setLang()">${S.lang=="hi"?"EN":"हिं"}</button></div><div class="pg"><i style="width:${n/4*100}%"></i></div><div class="pgl">${n}/4</div>`}
function scanBody(){let k="";try{k=localStorage.getItem("gk")||""}catch(e){}
 let h=`<input id="f" type="file" accept="image/*" multiple hidden onchange="const fl=[...this.files];this.value='';scan(fl)"><input id="fc" type="file" accept="image/*" capture="environment" hidden onchange="const fl=[...this.files];this.value='';scan(fl)"><div class="frame"><i class="a"></i><i class="b"></i><i class="c"></i><i class="d"></i><p class="sub">${T("Photo of all bottles, strips or the prescription","सभी बोतलों, पत्तों या पर्ची की फ़ोटो")}</p><div class="row" style="gap:8px"><button class="big g" style="flex:1" onclick="$('#fc').click()">📷 ${T("Camera","कैमरा")}</button><button class="big g" style="flex:1" onclick="$('#f').click()">🖼️ ${T("Gallery (many)","गैलरी (कई)")}</button></div><p class="sub" style="font-size:13px;margin:8px 0 0">${T("Each photo adds to the list below.","हर फ़ोटो नीचे की सूची में जुड़ती जाती है।")}</p></div><button class="big alt" onclick="scan([])">▶ ${T("Demo: scan 3 medicines","डेमो: 3 दवाइयाँ स्कैन करें")}</button>`;
 if(S.scanning||S.msg)h+=`<div class="card">${S.scanning?"⏳":S.fail?"⚠️":"✅"} ${S.msg}</div>`;
 if(S.meds.length)h+=`<h2>${T("Check the list","सूची जाँचें")}</h2>`+S.meds.map((m,i)=>`<div class="card row">${pill(m.g)}<div class="grow"><div class="name">${m.t}</div><div class="sub" style="margin:0;font-size:15px">${m.g?"= "+DB[m.g].n[L()]+" · "+DB[m.g].w[L()]:"⚠️ "+T("not recognised","पहचान नहीं हुई")}</div></div><button class="x" onclick="rm(${i})">✕</button></div>`).join("")+`<div class="row"><input type="text" id="add" placeholder="${T("Add medicine (e.g. Crocin)","दवा जोड़ें (जैसे Crocin)")}"><button class="x" style="background:var(--brand);color:#fff" onclick="addB()">＋</button></div>`;
 return h+`<details class="card"><summary>${T("Live AI scan (optional)","लाइव AI स्कैन (वैकल्पिक)")}</summary><p class="sub">${T("Paste a Gemini API key. Stays on your phone.","Gemini API key डालें। सिर्फ़ आपके फ़ोन में रहती है।")}</p><input type="text" value="${k}" placeholder="Gemini API key" onchange="try{localStorage.setItem('gk',this.value)}catch(e){}"></details>`}

function vWelcome(){return`<div class="ob" style="padding-top:30px">${mascot("happy",170)}<div class="wm" style="font-size:44px;margin-top:6px"><span>Pill</span><b>Check</b></div><p class="sub" style="font-size:20px">Scan. Verify. Stay Safe.<br>${T("Your medicines, spoken aloud.","आपकी दवाइयाँ, बोलकर बताईं।")}</p><div class="row" style="margin:8px 0"><button class="lg" onclick="setLang('en')" style="${S.lang=="en"?"border-color:var(--brand)":""}">English</button><button class="lg" onclick="setLang('hi')" style="${S.lang=="hi"?"border-color:var(--brand)":""}">हिन्दी</button></div></div><div class="cta"><button class="big g" onclick="go(1)">${T("Get started","शुरू करें")}</button></div>`}
function vScan1(){return`<div class="ob">${prog(1)}${mascot("happy",90)}<h1>${T("Scan your medicines","अपनी दवाइयाँ स्कैन करें")}</h1></div>${scanBody()}<div class="cta"><button class="big" ${S.meds.length?"":"disabled"} onclick="analyse(true);go(2)">${T("Check safety","सुरक्षा जाँचें")}</button></div>`}
function vSafe(){return`<div class="ob">${prog(2)}${mascot(level()=="red"?"angry":"happy",90)}<h1>${T("Safety check","सुरक्षा जाँच")}</h1></div>${light()}<p class="disc">${T("Not a replacement for a doctor's advice.","यह डॉक्टर की सलाह का विकल्प नहीं है।")}</p><div class="cta"><button class="big" onclick="go(3)">${T("Next","आगे")}</button></div>`}
function vTimes(){return`<div class="ob">${prog(3)}${mascot("happy",90)}<h1>${T("When do you take meds?","दवा कब लेते हैं?")}</h1><p class="sub">${T("Select all that apply","जो लागू हों चुनें")}</p></div>`+SL.map((s,i)=>`<div class="opt s${i} ${S.on[i]?"":"off"}"><span style="font-size:30px">${s[2]}</span><b class="grow" onclick="tog(${i})">${s[L()]}</b><input type="time" value="${S.times[i]}" onchange="S.times[${i}]=this.value;save()"><span class="ck" onclick="tog(${i})">${S.on[i]?"☑️":"⬜"}</span></div>`).join("")+`<div class="cta"><button class="big" onclick="go(4)">${T("Next","आगे")}</button></div>`}
function vRem(){const o=(on,f,ic,a,b)=>`<button class="opt ${on?"on":""}" onclick="${f}"><span style="font-size:30px">${ic}</span><span><b>${a}</b><br><span class="sub" style="margin:0;font-size:15px">${b}</span></span><span class="ck">${on?"✅":"⬜"}</span></button>`;
 return`<div class="ob">${prog(4)}${mascot("happy",90)}<h1>${T("Reminder style","रिमाइंडर का तरीका")}</h1></div>`+o(S.rem=="full","S.rem='full';render()","📱",T("Full screen","फ़ुल स्क्रीन"),T("Big alert that gets attention (recommended)","बड़ा अलर्ट जो ध्यान खींचे (सुझावित)"))+o(S.rem=="small","S.rem='small';render()","🔔",T("Small banner","छोटा बैनर"),T("Quiet alert for regular users","नियमित लेने वालों के लिए"))+`<h2>${T("Voice tone","आवाज़ का अंदाज़")}</h2>`+o(S.tone=="calm","S.tone='calm';render()","😊",T("Calm","शांत"),T("Reminds once, gently","एक बार प्यार से याद दिलाए"))+o(S.tone=="nag","S.tone='nag';render()","😠",T("Nagging","टोकने वाला"),T("Mascot gets angry until you take it","जब तक दवा न लें, गुस्सा बढ़ता जाए"))+`<button class="big alt" style="margin-top:8px" onclick="testAlarm()">🔔 ${T("Preview reminder","रिमाइंडर देखें")}</button><div class="cta"><button class="big g" onclick="finish()">${T("Finish setup","सेटअप पूरा करें")}</button></div>`}
function vToday(){
 if(!S.meds.length)return`<div class="ob" style="padding-top:20px">${mascot("happy",130)}<h1>${T("Namaste!","नमस्ते!")}</h1><p class="sub">${T("No medicines added yet.","अभी कोई दवा नहीं जुड़ी।")}</p><button class="big g" onclick="tab('scan')">📷 ${T("Scan medicines","दवा स्कैन करें")}</button></div>`;
 const real=S.meds.map((m,i)=>[m,i]).filter(([m])=>m.g),dn=real.filter(([m,i])=>S.taken[i]).length;
 let h=`<h1>${T("Today's medicines","आज की दवाइयाँ")}</h1><div class="row"><div class="grow bar"><i style="width:${real.length?dn/real.length*100:0}%"></i></div><b>${dn}/${real.length}</b></div>`+light()+`<div class="row" style="margin-top:6px"><button class="big alt" onclick="readAll()">🔊 ${T("Read schedule","पूरा शेड्यूल सुनें")}</button><button class="big alt" style="width:auto" onclick="testAlarm()" aria-label="alarm">🔔</button></div>`;
 [0,1,2,3].forEach(si=>{const ms=real.filter(([m])=>S.on[si]&&m.slot==si);if(!ms.length)return;
  h+=`<div class="slot s${si}"><h2>${SL[si][2]} ${SL[si][L()]} · ${S.times[si]}</h2>`+ms.map(([m,i])=>{const d=DB[m.g];return`<div class="card row ${S.taken[i]?"done":""}">${pill(m.g)}<div class="grow"><div class="name">${d.n[L()]}</div><span class="tag">🍽️ ${FD[d.f][L()]}</span><span class="tag">💧 ${T("with water","पानी के साथ")}</span><div style="font-size:15px;color:var(--mute)">${d.w[L()]}</div></div><button class="chk" aria-label="taken" onclick="tk(${i})">✓</button></div>`}).join("")+`</div>`});
 return h+`<p class="disc">${T("Not a replacement for a doctor's advice. Interaction list is a demo set.","यह डॉक्टर की सलाह का विकल्प नहीं है। इंटरैक्शन सूची डेमो है।")}</p>`}
function shareLink(){const t="PillCheck · "+T("My medicines","मेरी दवाइयाँ")+"\n"+S.meds.filter(m=>m.g).map(m=>`${SL[m.slot][2]} ${S.times[m.slot]} ${DB[m.g].n[L()]} ${S.taken[S.meds.indexOf(m)]?"✅":"⏳"}`).join("\n")+(S.warn.length?"\n⚠️ "+S.warn.length+T(" warning(s)"," चेतावनी"):"");return"https://wa.me/?text="+encodeURIComponent(t)}
function vHelp(){const real=S.meds.filter(m=>m.g);
 return`<h1>🆘 ${T("Help","मदद")}</h1><div class="card" style="border-color:var(--r)"><h2 style="margin-top:0">${T("Emergency card","इमरजेंसी कार्ड")}</h2><div class="sub">${T("Show this to a doctor or hospital","डॉक्टर या अस्पताल को दिखाएँ")}</div>`+(real.length?real.map(m=>`<div class="row" style="margin:6px 0">${pill(m.g)}<b>${DB[m.g].n[L()]}</b></div>`).join(""):`<p>${T("No medicines yet.","अभी कोई दवा नहीं।")}</p>`)+`<b>${T("Allergies:","एलर्जी:")}</b><input type="text" value="${S.allergy}" placeholder="${T("e.g. Penicillin","जैसे Penicillin")}" onchange="S.allergy=this.value;save()"></div>
 <a href="${shareLink()}" target="_blank" rel="noopener" style="text-decoration:none"><button class="big g">💬 ${T("Send today's status to family","आज की स्थिति परिवार को भेजें")}</button></a>
 <button class="opt ${S.remOn?"on":""}" style="margin-top:12px" onclick="S.remOn=!S.remOn;save();render()"><span style="font-size:26px">🔔</span><b>${T("Reminders","रिमाइंडर")}: ${S.remOn?T("ON","चालू"):T("OFF","बंद")}</b><span class="ck">${S.remOn?"✅":"⬜"}</span></button><h2>${T("Why am I taking this?","यह दवा क्यों लेनी है?")}</h2>`+real.map(m=>`<div class="card row"><div class="grow name">${DB[m.g].n[L()]}</div><button class="mic" style="margin:0" onclick="say(DB['${m.g}'].n[L()]+T(' is for ',' ')+DB['${m.g}'].w[L()]+T('. Take it ',' के लिए है। ')+FD[DB['${m.g}'].f][L()])">🔊</button></div>`).join("")+`<a href="tel:108" style="text-decoration:none"><button class="big" style="background:var(--r);margin-top:14px">📞 ${T("Ambulance 108","एम्बुलेंस 108")}</button></a><button class="big alt" style="margin-top:10px" onclick="S.step=3;render()">⚙️ ${T("Change times & reminders","समय और रिमाइंडर बदलें")}</button>`}

const fc=(ic,c,t,d)=>`<div class="fc"><div class="fi" style="background:${c};margin:0;width:40px;height:40px;font-size:18px;flex:none">${ic}</div><div><b>${t}</b><small>${d}</small></div></div>`;
return`<header class="tb"><div class="tbi"><div class="row" style="gap:8px"><div class="logo"><img src="${LOGO}" alt=""></div><div class="wm"><span>Pill</span><b>Check</b></div></div><div class="nl"><a href="#ft">${T("Features","फ़ीचर्स")}</a><a href="#hw">${T("How it works","कैसे काम करता है")}</a><a href="#ab">${T("About","हमारे बारे में")}</a></div><div class="row" style="gap:8px"><button class="lg" onclick="setLang()">${S.lang=="hi"?"EN":"हिं"}</button><button class="sb" onclick="startApp()">${T("Get started","शुरू करें")}</button></div></div></header>
<section class="hero"><div><span class="chip">✨ ${T("AI-assisted medicine safety","AI से दवा की सुरक्षा")}</span><h1><span style="color:var(--navy)">Pill</span><span style="color:var(--brand)">Check</span></h1><div class="tg2">Scan. Verify. Stay Safe.</div><p>${T("PillCheck reads your medicine labels, flags risky combinations and builds a simple daily schedule. It speaks in Hindi, so nobody has to read small print.","PillCheck आपकी दवाइयों के लेबल पढ़ता है, ख़तरनाक मेल बताता है और रोज़ का आसान शेड्यूल बनाता है। हिंदी में बोलकर बताता है, छोटे अक्षर पढ़ने की ज़रूरत नहीं।")}</p><div class="bt"><button class="big" onclick="startApp()">📷 ${T("Start scanning","स्कैन शुरू करें")}</button><button class="big alt" onclick="startApp(true)">▶ ${T("Watch demo","डेमो देखें")}</button></div><div class="tr"><span>🔊 ${T("Hindi voice","हिंदी आवाज़")}</span><span>🔒 ${T("Data stays on your device","डेटा आपके फ़ोन में")}</span><span>🤖 ${T("AI-assisted","AI की मदद")}</span></div></div>
<div class="phw"><div class="ph"><div class="row" style="justify-content:center;gap:6px"><img src="${LOGO}" width="26" height="26" alt=""><b style="color:var(--navy)">PillCheck</b></div><div class="frame" style="padding:30px 8px;margin:10px 0"><i class="a"></i><i class="b"></i><i class="c"></i><i class="d"></i><div style="font-size:42px">💊</div></div><b>${T("Scanning...","स्कैन हो रहा है...")}</b><div class="sub" style="font-size:12px;margin:2px 0 0">${T("Reading names and checking interactions","नाम पढ़ रहा है, मेल जाँच रहा है")}</div></div>
<div class="fcs">${fc("📋","#EAF7F1",T("Check your list","लिस्ट जाँचें"),T("Brand names mapped to generics","ब्रांड नाम से जेनेरिक नाम"))}${fc("⚠️","#FFF7E3",T("Detect interactions","मेल की जाँच"),T("Avoid harmful combinations","ख़तरनाक मेल से बचें"))}${fc("🔔","#E9EFFA",T("Instant alerts","तुरंत अलर्ट"),T("Know the risk before you take it","लेने से पहले ख़तरा जानें"))}</div></div></section>
<section class="sec" id="ft"><h2>${T("Why choose PillCheck?","PillCheck क्यों?")}</h2><p class="sub">${T("Smarter checks. Safer medicines.","समझदार जाँच, सुरक्षित दवाइयाँ।")}</p><div class="grid5">${ft("📷","#EAF7F1",T("Scan & identify","स्कैन और पहचान"),T("Photos of all bottles at once","सभी बोतलों की फ़ोटो एक साथ"))}${ft("🇮🇳","#FFF1EA",T("Indian brands","भारतीय ब्रांड"),T("Dolo, Ecosprin, Pan-D and more","Dolo, Ecosprin, Pan-D आदि"))}${ft("🛡️","#E9EFFA",T("Interaction alerts","इंटरैक्शन अलर्ट"),T("Red, yellow, green in plain words","लाल, पीला, हरा, सरल भाषा में"))}${ft("🔊","#FFF7E3",T("Voice in Hindi","हिंदी में आवाज़"),T("Built for people who can't read","जो पढ़ नहीं सकते उनके लिए"))}${ft("👨‍👩‍👧","#F1F3F8",T("For families","परिवार के लिए"),T("Share today's status on WhatsApp","आज की स्थिति WhatsApp पर भेजें"))}</div></section>
<section class="sec" id="hw"><h2>${T("How it works","कैसे काम करता है")}</h2><p class="sub">${T("Just 3 simple steps","बस 3 आसान स्टेप")}</p><div class="steps"><div class="st"><div class="n">1</div><b>${T("Scan","स्कैन करें")}</b><p>${T("Take photos of your medicines","दवाइयों की फ़ोटो लें")}</p></div><div class="st"><div class="n">2</div><b>${T("Check","जाँचें")}</b><p>${T("See risky combinations in plain language","ख़तरनाक मेल सरल भाषा में देखें")}</p></div><div class="st"><div class="n">3</div><b>${T("Take safely","सुरक्षित लें")}</b><p>${T("Get a daily schedule with spoken reminders","बोलने वाले रिमाइंडर के साथ रोज़ का शेड्यूल")}</p></div></div></section>
<section class="sec" id="ab"><h2>${T("About","हमारे बारे में")}</h2><p class="sub" style="max-width:600px;margin:6px auto">${T("Built at CSI AITR × MLH Prompt 2 Product for the Prescription Safety Verification problem. PillCheck is an informational aid and does not replace a doctor or pharmacist. The interaction list in this demo is limited.","CSI AITR × MLH Prompt 2 Product में Prescription Safety Verification समस्या के लिए बनाया गया। PillCheck सिर्फ़ जानकारी देता है, डॉक्टर या फार्मासिस्ट का विकल्प नहीं है। इस डेमो की इंटरैक्शन सूची सीमित है।")}</p><div class="bt" style="justify-content:center"><button class="big" style="width:auto" onclick="startApp()">${T("Open PillCheck","PillCheck खोलें")}</button></div></section><div class="fo">PillCheck · Scan. Verify. Stay Safe.</div>`}
function startApp(d){S.view="app";if(S.step<1)S.step=1;else if(S.step>=5&&d)S.tab="scan";render();scrollTo(0,0);if(d)scan([])}
function home(){S.view="land";render();scrollTo(0,0)}
function render(){const a=$("#app"),n=S.step>=5&&S.view=="app";a.className=S.view=="land"?"wide":"";
 if(S.view=="land"){a.innerHTML=vLand();$("#nv").style.display="none";return}
 a.innerHTML=n?HEAD()+{today:vToday,scan:()=>`<h1>📷 ${T("Scan medicines","दवा स्कैन")}</h1>`+scanBody()+(S.meds.length?`<button class="big" style="margin-top:12px" onclick="analyse(true);tab('today')">✔ ${T("Update schedule","शेड्यूल बनाएँ")}</button>`:""),help:vHelp}[S.tab]():[vWelcome,vScan1,vSafe,vTimes,vRem][S.step]();
 $("#nv").style.display=n?"flex":"none";$("#nav").innerHTML=[["today","💊",T("Today","आज")],["scan","📷",T("Scan","स्कैन")],["help","🆘",T("Help","मदद")]].map(([k,i,l])=>`<button class="${S.tab==k?"on":""}" onclick="tab('${k}')"><b>${i}</b>${l}</button>`).join("")}
function go(n){S.step=n;if(n==2)computeWarn();save();render();scrollTo(0,0);if(n==2&&level()=="red")say(T("Careful. Two of your medicines are dangerous together.","सावधान। दो दवाइयाँ साथ लेना ख़तरनाक है।"))}
function tab(t){S.tab=t;render();scrollTo(0,0)}
function setLang(l){S.lang=l||(S.lang=="hi"?"en":"hi");save();render()}
function tog(i){S.on[i]=S.on[i]?0:1;save();render()}
function tk(i){S.taken[i]=!S.taken[i];save();render();if(S.taken[i])say(T("Well done.","बहुत अच्छे।"))}
function rm(i){S.meds.splice(i,1);analyse(true);render()}
function addB(){addMed($("#add").value);analyse(true);render()}
function finish(){analyse(true);S.step=5;S.tab="today";save();render();scrollTo(0,0);say(T("Your schedule is ready.","आपका शेड्यूल तैयार है।"))}
function readAll(){let t=T("Today's medicines. ","आज की दवाइयाँ। ");if(level()=="red")t+=T("First, a dangerous combination was found. ","पहले ध्यान दें, एक ख़तरनाक मेल मिला है। ");
 [0,1,2,3].forEach(si=>{const ms=S.meds.filter(m=>m.g&&S.on[si]&&m.slot==si);if(ms.length)t+=SL[si][L()]+" "+S.times[si]+". "+ms.map(m=>DB[m.g].n[L()]+", "+FD[DB[m.g].f][L()]).join(". ")+". "});say(t)}

let nagT=null;
function ring(si,test){let ms=S.meds.map((m,i)=>[m,i]).filter(([m,i])=>m.g&&m.slot==si&&!S.taken[i]).map(x=>x[1]);if(!ms.length&&test)ms=S.meds.map((m,i)=>m.g?i:-1).filter(i=>i>=0).slice(0,2);if(!ms.length)return;
 S.alarm={si,lvl:0,ms};drawAlarm();speakAlarm();clearInterval(nagT);if(S.tone=="nag")nagT=setInterval(()=>{if(!S.alarm)return clearInterval(nagT);S.alarm.lvl++;drawAlarm();speakAlarm()},12000)}
function testAlarm(){if(!S.meds.some(m=>m.g)){tab("scan");return}ring(S.meds.find(m=>m.g).slot,true)}
function speakAlarm(){const l=S.alarm.lvl;say(l==0?T("Time to take your medicines.","दवाई का समय हो गया।"):T("Please take your medicines now!","अभी दवाई लीजिए!"))}
function drawAlarm(){const el=$("#al"),A=S.alarm;if(!A){el.style.display="none";el.innerHTML="";return}
 const ang=S.tone=="nag"&&A.lvl>=1,red=S.tone=="nag"&&A.lvl>=2;
 const list=A.ms.map(i=>{const m=S.meds[i];return m&&m.g?`<div class="ar">${pill(m.g)}<div><b>${DB[m.g].n[L()]}</b><br>${FD[DB[m.g].f][L()]}</div></div>`:""}).join("");
 const acts=`<button class="big" style="background:var(--brand)" onclick="takeAll()">✓ ${T("Take now","अभी ली")}</button><button class="big alt" onclick="clearA()">${T("Skip","छोड़ें")}</button><button class="big alt" onclick="snooze()">⏰ ${T("Remind in 10 min","10 मिनट बाद")}</button>`;
 el.style.display="block";
 if(S.rem=="small"){el.className="sm";el.innerHTML=`<b>💊 ${T("Time for meds","दवा का समय")} · ${S.times[A.si]}</b>${list}<div class="row" style="margin-top:8px"><button class="big" style="background:var(--brand)" onclick="takeAll()">✓</button><button class="big alt" onclick="clearA()">✕</button></div>`}
 else{el.className="full"+(red?" red":"");el.innerHTML=`<div class="${ang?"shk":""}">${mascot(ang?"angry":"happy",ang?190:150)}</div><div>${T("TIME TO TAKE","दवा लेने का समय")}</div><h1>${T("MEDS","दवाई")}</h1><div style="margin:6px 0 10px">${SL[A.si][2]} ${SL[A.si][L()]} · ${S.times[A.si]}</div>${list}<div style="margin-top:12px">${acts}</div>`}}
function clearA(){S.alarm=null;clearInterval(nagT);try{speechSynthesis.cancel()}catch(e){}drawAlarm()}
function takeAll(){S.alarm.ms.forEach(i=>S.taken[i]=true);clearA();save();render();say(T("Well done.","बहुत अच्छे।"))}
function snooze(){const si=S.alarm.si;clearA();setTimeout(()=>ring(si),600000)}
setInterval(()=>{if(S.step<5||S.alarm||!S.remOn)return;const d=new Date(),hm=d.toTimeString().slice(0,5),day=d.toDateString();S.times.forEach((tm,si)=>{if(S.on[si]&&tm==hm&&S.fired[si]!=day){S.fired[si]=day;ring(si)}})},15000);
if(S.meds.length)computeWarn();
render();
</script>
</body>
</html>
